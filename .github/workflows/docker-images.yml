name: Test Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'images/ubuntu-slim/**'
      - '.github/workflows/docker-images.yml'
  pull_request:
    paths:
      - 'images/ubuntu-slim/**'
      - '.github/workflows/docker-images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-images:
    runs-on: windows-11-vs2026-arm
    strategy:
      matrix:
        directory:
          - images/ubuntu-slim
    steps:
      - uses: actions/checkout@v6

      - name: Run test.pwsh
        working-directory: ${{ matrix.directory }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./test.pwsh
